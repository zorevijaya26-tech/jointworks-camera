<!DOCTYPE html>
<html>

<head>

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Jointworks Attendance Camera</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .camera-container {
      width: 100%;
      max-width: 450px;
      padding: 25px;
    }

    h2 {
      margin-bottom: 12px;
      font-size: 22px;
    }

    #status {
      margin: 20px 0;
      font-size: 16px;
      color: #ccc;
    }

    #captureBtn {
      width: 90%;
      max-width: 350px;
      padding: 17px;
      border: none;
      border-radius: 10px;
      background: white;
      color: black;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #captureBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /*
      IMPORTANT:
      The video element is completely hidden.
      The camera is active in the background,
      but the employee cannot see the live
      camera image or their face.
    */

    #video {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      left: -100px;
      top: -100px;
    }

    #canvas {
      display: none;
    }

    #flash {
      position: fixed;
      inset: 0;
      background: white;
      opacity: 0;
      pointer-events: none;
    }

    .flash-effect {
      animation: flash 0.25s ease;
    }

    @keyframes flash {

      0% {
        opacity: 0;
      }

      30% {
        opacity: 1;
      }

      100% {
        opacity: 0;
      }

    }

    .success {
      color: #66bb6a !important;
    }

    .error {
      color: #ef5350 !important;
    }

  </style>

</head>


<body>


<div class="camera-container">

  <h2>
    Jointworks Attendance
  </h2>

  <div id="status">
    Starting camera...
  </div>

  <button
    id="captureBtn"
    disabled>

    CAPTURE PHOTO

  </button>

</div>


<!--
  Camera stream is active,
  but the video is NOT visible.
-->

<video
  id="video"
  autoplay
  playsinline>
</video>


<!-- Hidden canvas used to capture the photo -->

<canvas
  id="canvas">
</canvas>


<!-- Flash effect -->

<div id="flash"></div>


<script>


/*************************************************
 * VARIABLES
 *************************************************/

let stream = null;

let cameraReady = false;


/*************************************************
 * GET TOKEN FROM URL
 *************************************************/

const params =
  new URLSearchParams(
    window.location.search
  );


const token =
  params.get('token');


/*************************************************
 * PAGE ELEMENTS
 *************************************************/

const video =
  document.getElementById(
    'video'
  );


const canvas =
  document.getElementById(
    'canvas'
  );


const captureBtn =
  document.getElementById(
    'captureBtn'
  );


const status =
  document.getElementById(
    'status'
  );


const flash =
  document.getElementById(
    'flash'
  );


/*************************************************
 * CHECK CAMERA SESSION
 *************************************************/

if (!token) {

  status.textContent =
    'Invalid camera session.';

  status.classList.add(
    'error'
  );

} else {

  startCamera();

}


/*************************************************
 * START CAMERA
 *************************************************/

async function startCamera() {

  try {

    /*
      Front camera.

      The video stream is NOT displayed.
      It exists only so we can capture
      the camera frame.
    */

    stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal: 'user'
            },

            width: {
              ideal: 640
            },

            height: {
              ideal: 480
            }

          },

          audio: false

        });


    /*
      Connect camera stream to hidden
      video element.
    */

    video.srcObject =
      stream;


    /*
      Wait until camera has enough
      data for a frame.
    */

    await new Promise(
      function(resolve) {

        if (
          video.readyState >= 2
        ) {

          resolve();

        } else {

          video.onloadedmetadata =
            function() {

              resolve();

            };

        }

      }
    );


    /*
      Make sure video starts.
    */

    await video.play();


    cameraReady =
      true;


    captureBtn.disabled =
      false;


    status.textContent =
      'Camera ready.';

  }


  catch (error) {

    console.error(
      error
    );


    cameraReady =
      false;


    captureBtn.disabled =
      true;


    status.textContent =
      'Camera permission was not given.';


    status.classList.add(
      'error'
    );


    alert(
      'Please allow camera permission and try again.'
    );

  }

}


/*************************************************
 * CAPTURE PHOTO
 *************************************************/

captureBtn.addEventListener(
  'click',
  function() {

    capturePhoto();

  }
);


/*************************************************
 * CAPTURE PHOTO FUNCTION
 *************************************************/

function capturePhoto() {


  if (
    !cameraReady ||
    !stream
  ) {

    alert(
      'Camera is not ready yet.'
    );

    return;

  }


  /*
    Make sure the camera frame has
    actual dimensions.
  */

  const width =
    video.videoWidth;

  const height =
    video.videoHeight;


  if (
    !width ||
    !height
  ) {

    alert(
      'Camera is still starting. Please try again.'
    );

    return;

  }


  /***********************************************
   * SET HIDDEN CANVAS SIZE
   ***********************************************/

  canvas.width =
    width;

  canvas.height =
    height;


  /***********************************************
   * CAPTURE CURRENT CAMERA FRAME
   ***********************************************/

  const ctx =
    canvas.getContext(
      '2d'
    );


  ctx.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  /***********************************************
   * CONVERT PHOTO TO JPEG
   ***********************************************/

  const photo =
    canvas.toDataURL(
      'image/jpeg',
      0.75
    );


  /***********************************************
   * FLASH EFFECT
   ***********************************************/

  flash.classList.remove(
    'flash-effect'
  );


  void flash.offsetWidth;


  flash.classList.add(
    'flash-effect'
  );


  /***********************************************
   * CAMERA IS NO LONGER NEEDED
   ***********************************************/

  stopCamera();


  cameraReady =
    false;


  captureBtn.disabled =
    true;


  status.textContent =
    'Photo captured successfully.';


  status.classList.remove(
    'error'
  );


  status.classList.add(
    'success'
  );


  /***********************************************
   * SEND PHOTO TO APPS SCRIPT PAGE
   ***********************************************/

  if (
    window.opener &&
    !window.opener.closed
  ) {

    window.opener.postMessage(

      {

        type:
          'JOINTWORKS_SELFIE',

        token:
          token,

        selfieData:
          photo,

        capturedTime:
          new Date().toISOString()

      },

      '*'

    );


    /*********************************************
     * CLOSE CAMERA PAGE
     *********************************************/

    setTimeout(
      function() {

        window.close();

      },
      700
    );


  } else {

    /*
      Fallback if the browser does not
      allow the camera tab to close.
    */

    status.textContent =
      'Photo captured. Please return to the attendance page.';

  }

}


/*************************************************
 * STOP CAMERA
 *************************************************/

function stopCamera() {

  if (stream) {

    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );

    stream =
      null;

  }


  video.srcObject =
    null;

}


/*************************************************
 * STOP CAMERA WHEN PAGE CLOSES
 *************************************************/

window.addEventListener(
  'beforeunload',
  function() {

    stopCamera();

  }
);


</script>


</body>

</html>
